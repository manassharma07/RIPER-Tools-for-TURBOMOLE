[server]
# Default: true
enableCORS = true

# Enables support for Cross-Site Request Forgery (XSRF) protection, for added
# security.

# Due to conflicts between CORS and XSRF, if `server.enableXsrfProtection` is
# on and `server.enableCORS` is off at the same time, we will prioritize
# `server.enableXsrfProtection`.

# Default: true
enableXsrfProtection = false

# Max size, in megabytes, for files uploaded with the file_uploader.
# 50 MB accommodates bands.xyz / bands_proj.xyz of large systems (hundreds of bands x
# hundreds of k points) while still protecting the Streamlit Cloud instance; the band
# structure plotter additionally accepts .gz compressed files, which are typically
# 5-8x smaller.

# Default: 200
maxUploadSize = 50